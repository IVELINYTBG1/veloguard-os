name: Build VeloGuardOS ISO

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write          # attach the ISO to a Release

jobs:
  iso:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged   # mkarchiso needs loop devices / mounts
    steps:
      - uses: actions/checkout@v4

      - name: Install archiso
        run: pacman -Sy --noconfirm --needed archiso

      - name: Build the live ISO
        run: OUT=/tmp/out WORK=/tmp/work bash iso/build.sh

      - name: Upload ISO as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: veloguardos-iso
          path: /tmp/out/*.iso
          if-no-files-found: error

      - name: Attach ISO to the Release (on tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/out/*.iso
