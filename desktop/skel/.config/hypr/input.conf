# VeloGuardOS — input devices. See https://wiki.hypr.land/Configuring/Basics/Variables/#input
# Derived from Omarchy config/hypr/input.conf (MIT).
input {
  # Multiple layouts switchable with Left Alt + Right Alt:
  # kb_layout = us,bg
  # kb_options = grp:alts_toggle

  kb_options = compose:caps

  repeat_rate = 40
  repeat_delay = 250
  numlock_by_default = true

  touchpad {
    clickfinger_behavior = true
    scroll_factor = 0.4
  }
}

# Scroll nicely in the terminal
windowrule = match:class (Alacritty|kitty|foot), scroll_touchpad 1.5
