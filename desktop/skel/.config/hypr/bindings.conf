# VeloGuardOS — your personal keybinding overrides (edit freely).
#
# VeloGuardOS uses the DEFAULT Hyprland bindings (see
# /usr/share/veloguard/desktop/hypr/bindings/hyprland-default.conf) plus a few
# VeloGuard additions (…/veloguard.conf). Highlights:
#   SUPER+Q terminal · SUPER+C close · SUPER+E files · SUPER+R launcher
#   SUPER+V float · SUPER+M exit · SUPER 1-0 workspaces · SUPER+S scratchpad
#   SUPER+SHIFT+G guard menu · SUPER+SHIFT+V VPN · SUPER+SHIFT+A agent
#   SUPER+ESCAPE power menu · SUPER+SHIFT+T theme
#
# Add your own below; to change a default, unbind it first:
#   unbind = SUPER, Q
#   bind = SUPER, RETURN, exec, uwsm-app -- alacritty
