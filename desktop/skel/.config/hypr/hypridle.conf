# VeloGuardOS idle management — derived from Omarchy config/hypr/hypridle.conf
# (MIT). Rewired from omarchy-* wrappers to stock hyprlock / loginctl / hyprctl.

general {
    lock_cmd = pidof hyprlock || hyprlock                 # avoid duplicate lockers
    before_sleep_cmd = loginctl lock-session              # lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on            # wake the display on resume
    inhibit_sleep = 3                                     # wait until locked
}

# Dim/lock after 5 minutes idle, DPMS off after 5.5 minutes.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
