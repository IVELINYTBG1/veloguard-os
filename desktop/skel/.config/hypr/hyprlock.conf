# VeloGuardOS lock screen — derived from Omarchy config/hypr/hyprlock.conf (MIT).
# Theme colors come from the active VeloGuard theme (guarded so a missing theme
# never breaks the lock screen).

# hyprlang noerror true
source = ~/.config/veloguard/current/hyprlock.conf
# hyprlang noerror false

# Fallback colors if the theme file above is absent
$color = rgba(19, 32, 58, 1.0)
$inner_color = rgba(0, 0, 0, 0.6)
$outer_color = rgba(51, 204, 255, 1.0)
$font_color = rgba(255, 255, 255, 1.0)
$check_color = rgba(0, 255, 153, 1.0)

general {
    ignore_empty_input = true
}

background {
    monitor =
    color = $color
    path = /usr/share/backgrounds/veloguard/default.png
    blur_passes = 3
}

animations {
    enabled = false
}

input-field {
    monitor =
    size = 650, 100
    position = 0, 0
    halign = center
    valign = center

    inner_color = $inner_color
    outer_color = $outer_color
    outline_thickness = 4

    font_family = JetBrainsMono Nerd Font
    font_color = $font_color

    placeholder_text = 🛡  VeloGuardOS — Enter Password
    check_color = $check_color
    fail_text = <i>$FAIL ($ATTEMPTS)</i>

    rounding = 0
    shadow_passes = 0
    fade_on_empty = false
}

auth {
    fingerprint:enabled = false
}
