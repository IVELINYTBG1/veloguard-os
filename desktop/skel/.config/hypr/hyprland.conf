# VeloGuardOS — Hyprland entry config (derived from Omarchy config/hypr/hyprland.conf, MIT).
# Learn how to configure Hyprland: https://wiki.hypr.land/Configuring/

# ── VeloGuardOS defaults (shipped, read-only — do not edit these directly) ──
source = /usr/share/veloguard/desktop/hypr/envs.conf
source = /usr/share/veloguard/desktop/hypr/autostart.conf
source = /usr/share/veloguard/desktop/hypr/looknfeel.conf
source = /usr/share/veloguard/desktop/hypr/windows.conf
source = /usr/share/veloguard/desktop/hypr/bindings/hyprland-default.conf
source = /usr/share/veloguard/desktop/hypr/bindings/veloguard.conf

# ── NVIDIA session env (written by the hardware layer on NVIDIA GPUs only) ──
# hyprlang noerror true
source = /usr/share/veloguard/desktop/hypr/nvidia.conf
# hyprlang noerror false

# ── Active theme colors (managed by `veloguard-theme`) ─────────────────────
# hyprlang noerror true
source = ~/.config/veloguard/current/hyprland.conf
# hyprlang noerror false

# ── Your personal overrides (edit these; they win over the defaults above) ──
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/bindings.conf
source = ~/.config/hypr/looknfeel.conf
source = ~/.config/hypr/autostart.conf

# Add any other personal Hyprland configuration below.
# windowrule = workspace 5, match:class qemu
