# VeloGuardOS — NVIDIA session environment.
#
# Shipped EMPTY on purpose: the Hyprland entry config `source`s this file, and
# Hyprland errors ("source globbing error: found no match") if it is absent —
# so it must always exist. On NVIDIA hardware the first-boot hardware layer
# (desktop/hardware/nvidia.sh) OVERWRITES this file with the real GBM/cursor env.
# On Intel/AMD it stays empty (a harmless no-op source).
