# VeloGuardOS environment — derived from Omarchy default/hypr/envs.conf (MIT).
# See desktop/omarchy/PROVENANCE.md.

# Theme-provided gum styling env (created by veloguard-theme). Guarded so a
# missing theme file never aborts config parsing.
# hyprlang noerror true
source = ~/.config/veloguard/current/gum.env.conf
# hyprlang noerror false

# Cursor size
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# Force all apps to use Wayland where possible
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_STYLE_OVERRIDE,kvantum
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = OZONE_PLATFORM,wayland
env = XDG_SESSION_TYPE,wayland

# Screen-sharing support (portals)
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland

xwayland {
  force_zero_scaling = true
}

env = XCOMPOSEFILE,~/.XCompose

ecosystem {
  no_update_news = true
}
