# VeloGuardOS additions on top of the default Hyprland bindings.
# All under SUPER+SHIFT / SUPER+CTRL / function keys so they never clobber a
# stock Hyprland default (Q/C/M/E/V/R/P/J/S/arrows/0-9).

# ── Guard integration ──────────────────────────────────────────────────────
bind = SUPER SHIFT, G, exec, veloguard-guard-menu
bind = SUPER SHIFT, V, exec, veloguard-guard-menu vpn
bind = SUPER SHIFT, A, exec, veloguard-agent
bind = SUPER, ESCAPE, exec, veloguard-powermenu
bindl = , XF86PowerOff, exec, veloguard-powermenu

# ── Look & feel ────────────────────────────────────────────────────────────
bind = SUPER SHIFT, T, exec, veloguard-theme menu
bind = SUPER SHIFT, SPACE, exec, pkill -SIGUSR1 waybar      # toggle top bar

# ── Session ────────────────────────────────────────────────────────────────
bind = SUPER CTRL, L, exec, loginctl lock-session
bind = SUPER CTRL, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy

# ── Captures (grim / slurp / hyprpicker) ───────────────────────────────────
bind = , PRINT, exec, grim -g "$(slurp)" - | wl-copy && notify-send -u low "Screenshot copied"
bind = SHIFT, PRINT, exec, grim - | wl-copy && notify-send -u low "Screenshot copied"
bind = SUPER, PRINT, exec, pkill hyprpicker || hyprpicker -a

# ── Notifications (mako) ───────────────────────────────────────────────────
bind = SUPER SHIFT, BACKSPACE, exec, makoctl dismiss --all
bind = SUPER CTRL, BACKSPACE, exec, makoctl mode -t do-not-disturb
