# VeloGuardOS autostart — derived from Omarchy default/hypr/autostart.conf (MIT).
# See desktop/omarchy/PROVENANCE.md. Omarchy's omarchy-* autostarts are replaced
# with stock tools + VeloGuard equivalents so the image stays hermetic.

# Make sure a theme is selected (creates ~/.config/veloguard/current if missing).
exec-once = veloguard-theme ensure

# Core session services (plain launches — VeloGuardOS does not use uwsm)
exec-once = hypridle
exec-once = mako
exec-once = waybar
exec-once = swaybg -i "$(veloguard-theme background)" -m fill

# Polkit authentication agent (VPN/import/update flows raise polkit prompts)
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# First-boot: run the guard AI-plane setup wizard once (no-op afterward)
exec-once = veloguard-firstboot-desktop

# Slow-app-launch fix: export the session environment to systemd + D-Bus
exec-once = systemctl --user import-environment $(env | cut -d'=' -f 1)
exec-once = dbus-update-activation-environment --systemd --all
