# VeloGuardOS window rules — derived from Omarchy default/hypr/windows.conf (MIT).
# See desktop/omarchy/PROVENANCE.md. Hyprland 0.53+ syntax.

windowrule = suppress_event maximize, match:class .*

# Tag all windows for default opacity (apps can override via the -default-opacity tag)
windowrule = tag +default-opacity, match:class .*

# Fix some dragging issues with XWayland
windowrule = no_focus on, match:class ^$, match:title ^$, match:xwayland 1, match:float 1, match:fullscreen 0, match:pin 0

# Float VeloGuard helper dialogs (VPN import, power menu, guard menu use wofi/zenity)
windowrule = float, match:class ^(org.freedesktop.impl.portal.desktop.gtk)$
windowrule = float, match:class ^(zenity)$
windowrule = center, match:class ^(zenity)$

# Apply default opacity after apps have had a chance to opt out
windowrule = opacity 0.985 0.96, match:tag default-opacity
