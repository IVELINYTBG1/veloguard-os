---
# Install the VeloGuardOS default apps into the freshly-installed system.
# (Runs in the target chroot. Flatpak-in-chroot can be finicky during install;
#  if it misbehaves on the test boot, we'll switch this to a first-boot service.)
dontChroot: false
timeout: 3600
script:
  # best-effort: needs network (flatpak); '|| true' so an offline install
  # still completes — apps can be added on first boot instead of failing
  # the whole installation at the last step.
  - command: "/opt/veloguard/provision/install-default-apps.sh || true"
    timeout: 3600
