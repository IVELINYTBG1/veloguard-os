---
# GRUB on both firmware types: handles UEFI (efiBootLoader) and legacy BIOS
# (grub-install to the disk's MBR) with one config.
efiBootLoader: "grub"
kernel: "/boot/vmlinuz-linux"
img: "/boot/initramfs-linux.img"
fallback: "/boot/initramfs-linux-fallback.img"
timeout: "5"
bootloaderEntryName: "VeloGuardOS"
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
installEFIFallback: true
