---
units:
  - name: NetworkManager.service
    action: enable
  - name: sddm.service
    action: enable
  - name: veloguard-update.timer
    action: enable
  - name: veloguard-wifi-autodetect.service
    action: enable
  - name: veloguard-hardware.service
    action: enable
  # SSD health: periodic TRIM (weekly) so write performance doesn't degrade.
  - name: fstrim.timer
    action: enable
