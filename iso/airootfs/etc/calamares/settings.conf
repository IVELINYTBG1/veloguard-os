---
# VeloGuardOS — Calamares installer sequence (original config).
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id:     veloguardapps
  module: shellprocess
  config: shellprocess_apps.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - veloguardai          # ← our custom AI setup page (blue-shield)
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - luksbootkeyfile
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - bootloader
  - veloguardaijob       # ← apply the AI choices into the installed system
  - shellprocess@veloguardapps   # ← install the default apps
  - umount
- show:
  - finished

branding: veloguardos
prompt-install: true
dont-chroot: false
