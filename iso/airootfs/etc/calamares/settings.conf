---
# VeloGuardOS — Calamares installer sequence.
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id:     veloguardapps
  module: shellprocess
  config: shellprocess_apps.conf
- id:     veloguardcleanup
  module: shellprocess
  config: shellprocess_cleanup.conf

# NOTE: the custom AI pages (veloguardai / veloguardaijob, staged in
# /usr/lib/calamares/modules) are deliberately NOT in the sequence yet — they
# ship with the AI-integration milestone after the base installer is confirmed
# working end to end. Re-add 'veloguardai' to show and 'veloguardaijob' to exec.

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - luksbootkeyfile
  - users
  - displaymanager
  - networkcfg
  - hwclock
  # strip the live-ISO machinery BEFORE regenerating the initramfs — the
  # archiso hooks must never reach the installed system's boot chain
  - shellprocess@veloguardcleanup
  - initcpio
  - services-systemd
  - bootloader
  - shellprocess@veloguardapps
  - umount
- show:
  - finished

branding: veloguardos
prompt-install: true
dont-chroot: false
