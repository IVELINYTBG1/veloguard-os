---
# VeloGuardOS — Calamares installer sequence.
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id:     veloguardcleanup
  module: shellprocess
  config: shellprocess_cleanup.conf
- id:     veloguardkernel
  module: shellprocess
  config: shellprocess_kernel.conf
- id:     veloguardapps
  module: shellprocess
  config: shellprocess_apps.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
# - veloguardai          # AI setup page — re-enable at the AI-integration milestone
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - luksbootkeyfile
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - shellprocess@veloguardcleanup   # strip live-ISO machinery (BEFORE initcpio)
  - shellprocess@veloguardkernel    # archiso keeps the kernel off the squashfs —
                                    #   copy vmlinuz into the target before mkinitcpio
  - initcpio                        # stock initramfs for the installed system
  - services-systemd
  - bootloader
# - veloguardaijob       # applies the AI page choices — re-enable with veloguardai
  - shellprocess@veloguardapps      # default apps (best-effort, non-fatal)
  - umount
- show:
  - finished

branding: veloguardos
prompt-install: true
dont-chroot: false
