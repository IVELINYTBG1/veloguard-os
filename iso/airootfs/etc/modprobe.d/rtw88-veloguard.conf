# The shipped test hardware's built-in Wi-Fi is a Realtek RTL8822CE (PCIe,
# rtw88_8822ce; its Bluetooth half is the USB 0bda:b00c device). rtw88 is
# notorious for drops and failed scans with PCIe power management enabled —
# trade a little battery for a radio that stays up. Harmless when the modules
# aren't loaded; delete this file to restore kernel defaults.
options rtw88_pci  disable_aspm=1
options rtw88_core disable_lps_deep=1
