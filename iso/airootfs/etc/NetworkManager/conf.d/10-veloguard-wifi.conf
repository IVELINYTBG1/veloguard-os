# Force NetworkManager to use wpa_supplicant for Wi-Fi. Without an explicit
# backend (and with iwd masked), NM had none → it showed every network as "open"
# and couldn't authenticate. wpa_supplicant is installed and parses WPA/RSN +
# does the EAPOL handshake.
[device]
wifi.backend=wpa_supplicant

[connection]
# Power-save off — Realtek USB adapters reset/flap with it on.
wifi.powersave=2
